name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Engine tests (1000 days + 500 levels)
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install

      # Signing key comes from repository secrets (Settings > Secrets and variables > Actions):
      # NUMDART_KEYSTORE_BASE64, NUMDART_KEYSTORE_PASSWORD
      # Without them only a test APK (debug-signed) is produced.
      - name: Prepare upload key
        id: key
        env:
          KS_B64: ${{ secrets.NUMDART_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build test APK
        if: steps.key.outputs.signed == 'false'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build signed AAB + APK
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          NUMDART_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          NUMDART_KEYSTORE_PASSWORD: ${{ secrets.NUMDART_KEYSTORE_PASSWORD }}
          NUMDART_KEY_PASSWORD: ${{ secrets.NUMDART_KEYSTORE_PASSWORD }}
          NUMDART_KEY_ALIAS: numdart-upload
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/numdart-1.0.1.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab out/numdart-1.0.1.aab
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: numdart-android
          path: out/
          retention-days: 90
